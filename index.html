<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bout de Fil — The Fringe Collection</title>
  <meta name="description" content="Handcrafted bags with movement, texture, and fun silhouettes. Drop 01: The Fringe Collection. Limited releases.">
  <meta name="theme-color" content="#f2e4d6">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <a class="logo" href="#top" aria-label="Bout de Fil — home">Bout de Fil</a>

    <nav class="nav" id="site-nav" aria-label="Primary">
      <ul class="nav__list">
        <li><a class="nav__link" href="#shop">Shop</a></li>
        <li><a class="nav__link" href="#collection">Collection</a></li>
        <li><a class="nav__link" href="#story">Our Story</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" type="button" aria-label="Shopping bag, 0 items" data-cart>
        <svg class="icon-bag" viewBox="0 0 32 38" width="32" height="38" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.2 11.5h25.6c.7 0 1.3.6 1.3 1.3l-.9 21.4c-.1 1.6-1.4 2.8-3 2.8H5.8c-1.6 0-2.9-1.2-3-2.8L1.9 12.8c0-.7.6-1.3 1.3-1.3Z"/>
          <path d="M10.5 15.5V9.2C10.5 5.8 12.9 3 16 3s5.5 2.8 5.5 6.2v6.3"/>
        </svg>
      </button>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__media">
        <img class="hero__img"
             src="assets/images/hero.jpg"
             data-fallback="assets/images/hero-fallback.svg"
             alt="Two fringed knot handbags — one burgundy jacquard, one zebra print — on a cream bouclé chair beside a burgundy drape"
             width="1600" height="1440" fetchpriority="high">
      </div>

      <div class="hero__content">
        <p class="eyebrow"><span>Drop 01</span></p>

        <h1 class="hero__title" id="hero-title">
          <span>The Fringe</span>
          <span>Collection</span>
        </h1>

        <div class="hero__body">
          <p class="hero__lead">Handcrafted bags with movement,<br class="br-desktop"> texture, and fun silhouettes.</p>
          <p class="hero__note">Limited releases.</p>
          <a class="btn" href="#shop">
            <span class="btn__label">Shop the Drop</span>
            <svg class="btn__arrow" viewBox="0 0 40 12" width="40" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 6h37M33 1l5 5-5 5"/>
            </svg>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
